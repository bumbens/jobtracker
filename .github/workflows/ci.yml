name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobtracker
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: jobtracker-backend
        run: chmod +x mvnw

      - name: Run backend tests
        working-directory: jobtracker-backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/jobtracker
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          JWT_SECRET: ci-test-secret-never-used-outside-this-pipeline
        run: ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jobtracker-frontend/package-lock.json

      - name: Install dependencies
        working-directory: jobtracker-frontend
        run: npm ci

      - name: Lint
        working-directory: jobtracker-frontend
        run: npm run lint

      - name: Build
        working-directory: jobtracker-frontend
        run: npm run build
